# Ports, credentials and the project name come from .env (see .env.example). There are no fixed
# container names, so several projects made from this template can run side by side: scripts find
# a container with `docker compose ps -q app`.
services:
  app:
    build:
      context: ./
      dockerfile: ./docker-conf/PHPAPACHE.Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./:/var/www/html
    environment:
      # The app reaches the database over the Compose network. These win over DB_HOST/DB_PORT
      # in .env, which describe how the host reaches it.
      DB_HOST: db
      DB_PORT: "3306"
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
  db:
    # MySQL 8.4 LTS. Its defaults are already utf8mb4 with the utf8mb4_0900_ai_ci collation.
    image: mysql:8.4
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - persistent:/var/lib/mysql
      # Creates <DB_NAME>_test for the tests when the volume is first created
      - ./docker-conf/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
    environment:
      MYSQL_DATABASE: ${DB_NAME:-theapp}
      MYSQL_USER: ${DB_USER:-theapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-theapp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-theapp}
    healthcheck:
      # Over TCP, so it fails while the entrypoint's temporary socket-only server is running
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  persistent:
