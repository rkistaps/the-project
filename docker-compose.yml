version: "3"
services:
  app:
    container_name: theapp_workspace
    build:
      context: ./
      dockerfile: ./docker-conf/PHPAPACHE.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
    environment:
      # The app reaches the database over the Compose network. These win over DB_HOST/DB_PORT
      # in .env, which describe how the host reaches it.
      DB_HOST: db
      DB_PORT: "3306"
    networks:
      - default
    depends_on:
      - db
  db:
    build:
      context: ./
      dockerfile: ./docker-conf/MySQL.Dockerfile
    ports:
      - "3306:3306"
    volumes:
      - persistent:/var/lib/mysql
      - ./docker-conf/mycustom.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - default
    # Compose reads these from .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-theapp}
      MYSQL_USER: ${DB_USER:-theapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-theapp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-theapp}
volumes:
  persistent:
