# Ports, credentials and the project name come from .env (see .env.example). There are no fixed
# container names, so several projects made from this template can run side by side: scripts find
# a container with `docker compose ps -q app`.
services:
  app:
    build:
      context: ./
      dockerfile: ./docker-conf/PHPAPACHE.Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./:/var/www/html
    environment:
      # The app reaches the database over the Compose network. These win over DB_HOST/DB_PORT
      # in .env, which describe how the host reaches it.
      DB_HOST: db
      DB_PORT: "3306"
    networks:
      - default
    depends_on:
      - db
  db:
    build:
      context: ./
      dockerfile: ./docker-conf/MySQL.Dockerfile
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - persistent:/var/lib/mysql
      - ./docker-conf/mycustom.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - default
    environment:
      MYSQL_DATABASE: ${DB_NAME:-theapp}
      MYSQL_USER: ${DB_USER:-theapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-theapp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-theapp}
volumes:
  persistent:
