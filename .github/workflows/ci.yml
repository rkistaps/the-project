name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer:
    name: Composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # composer.json is valid and the lock file matches it; no installed package has a security advisory.
      - name: Validate and audit
        run: |
          set +e
          composer validate --strict --no-interaction
          validate=$?
          composer audit --locked --no-interaction
          audit=$?
          if [ $validate -eq 0 ] && [ $audit -eq 0 ]; then
            echo "| Composer | ✅ | Valid · no security advisories |" > composer.md
          else
            problems=""
            [ $validate -ne 0 ] && problems="**composer.json is invalid** or the lock file is out of date"
            [ $audit -ne 0 ] && problems="${problems:+$problems · }**security advisories**: run \`composer audit\`"
            echo "| Composer | ❌ | $problems |" > composer.md
          fi
          cat composer.md >> "$GITHUB_STEP_SUMMARY"
          [ $validate -eq 0 ] && [ $audit -eq 0 ]

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-composer
          path: composer.md
          if-no-files-found: ignore

  codestyle:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v4

      # PER Coding Style, configured in .php-cs-fixer.dist.php. Check only: fix locally with
      # ./docker-run vendor/bin/php-cs-fixer fix
      - name: Check
        run: |
          set +e
          vendor/bin/php-cs-fixer check --diff --no-interaction --show-progress=none 2>&1 | tee codestyle.log
          status=${PIPESTATUS[0]}
          if [ $status -eq 0 ]; then
            echo "| Code style | ✅ | PER-CS |" > codestyle.md
          else
            files=$(grep -cE '^ *[0-9]+\) ' codestyle.log)
            echo "| Code style | ❌ | **${files} files** to fix — run \`./docker-run vendor/bin/php-cs-fixer fix\` |" > codestyle.md
          fi
          cat codestyle.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-codestyle
          path: codestyle.md
          if-no-files-found: ignore

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - uses: ramsey/composer-install@v4

      # Fails only on errors missing from phpstan-baseline.neon.
      - name: Analyse
        run: |
          set +e
          vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=json > phpstan.json
          php .github/scripts/phpstan-report.php phpstan.json phpstan-baseline.neon phpstan.md
          status=$?
          cat phpstan.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-phpstan
          path: phpstan.md
          if-no-files-found: ignore

  tests:
    name: PHPUnit + coverage
    runs-on: ubuntu-latest
    # The test database. Its name matches DB_NAME in .env.testing; the rest reaches PHP through env below.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: theapp_test
          MYSQL_USER: theapp
          MYSQL_PASSWORD: theapp
          MYSQL_ROOT_PASSWORD: theapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptheapp --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: theapp
      DB_PASSWORD: theapp
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - name: Run tests
        run: |
          set +e
          # --fail-on-skipped: database tests skip themselves without a database, which must not pass here
          vendor/bin/phpunit --fail-on-skipped --coverage-clover clover.xml --log-junit junit.xml
          status=$?
          php .github/scripts/phpunit-report.php junit.xml clover.xml phpunit.md
          cat phpunit.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-phpunit
          path: phpunit.md
          if-no-files-found: ignore

  # init:start. ./init removes this job along with itself.
  # Runs ./init on a copy of the template and checks the result, so the template can't drift from the script.
  init:
    name: Init script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Initialise a copy
        run: |
          cp -r . "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          ./init --package=acme/shop-app --namespace='Acme\ShopApp'
          test ! -e init
          if git grep -n -I -e 'TheProject' -e 'the-project' -e 'theapp' -- . ':!composer.lock'; then
            echo "::error::./init left the template's names in the files above"
            exit 1
          fi

      - name: Check the copy
        working-directory: ${{ runner.temp }}/project
        run: |
          composer install --no-interaction --no-progress
          composer validate --strict
          vendor/bin/phpstan analyse --no-progress --memory-limit=2G
          vendor/bin/phpunit
          vendor/bin/php-cs-fixer check --show-progress=none
  # init:end

  report:
    name: PR summary comment
    if: always() && github.event_name == 'pull_request'
    needs: [composer, codestyle, phpstan, tests]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Build summary
        run: |
          {
            echo "<!-- ci-report -->"
            echo "### CI report"
            echo
            echo "| Check | Status | Result |"
            echo "|---|:---:|---|"
            for name in composer codestyle phpstan phpunit; do
              if [ -f "reports/$name.md" ]; then
                cat "reports/$name.md"
              else
                echo "| $name | ⚠️ | Did not report — see the job log |"
              fi
            done
            echo
            echo "<sub>Commit ${{ github.event.pull_request.head.sha }} · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · new PHPStan errors are annotated on the diff</sub>"
          } > summary.md

      - name: Post or update comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- ci-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
