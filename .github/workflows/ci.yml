name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - uses: ramsey/composer-install@v3

      # Fails only on errors missing from phpstan-baseline.neon.
      - name: Analyse
        run: |
          set +e
          vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=json > phpstan.json
          php .github/scripts/phpstan-report.php phpstan.json phpstan-baseline.neon phpstan.md
          status=$?
          cat phpstan.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-phpstan
          path: phpstan.md
          if-no-files-found: ignore

  tests:
    name: PHPUnit + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Run tests
        run: |
          set +e
          vendor/bin/phpunit tests/ --coverage-clover clover.xml --log-junit junit.xml
          status=$?
          php .github/scripts/phpunit-report.php junit.xml clover.xml phpunit.md
          cat phpunit.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-phpunit
          path: phpunit.md
          if-no-files-found: ignore

  report:
    name: PR summary comment
    if: always() && github.event_name == 'pull_request'
    needs: [phpstan, tests]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Build summary
        run: |
          {
            echo "<!-- ci-report -->"
            echo "### CI report"
            echo
            echo "| Check | Status | Result |"
            echo "|---|:---:|---|"
            for name in phpstan phpunit; do
              if [ -f "reports/$name.md" ]; then
                cat "reports/$name.md"
              else
                echo "| $name | ⚠️ | Did not report — see the job log |"
              fi
            done
            echo
            echo "<sub>Commit ${{ github.event.pull_request.head.sha }} · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · new PHPStan errors are annotated on the diff</sub>"
          } > summary.md

      - name: Post or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- ci-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
