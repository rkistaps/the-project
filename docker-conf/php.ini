; Loaded after php.ini-development (see PHPAPACHE.Dockerfile).

; Deprecation notices are not shown. On PHP 8.4, dependencies raise them while they load (tightenco/collect
; on every request, opis/database, jawira/case-converter), before the app sends its headers, so showing them
; breaks the response. PHPUnit still reports deprecations (phpunit.xml.dist), including the app's own.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
